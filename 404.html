<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Match Addict</title>
  <script>
    // Mabar sekarang Match Addict di alamat baru. Path, query, dan #/live/KODE ikut dibawa supaya link lama tetap jalan.
    location.replace('https://asepsugi.github.io/match-addict/' +
      location.pathname.replace(/^\/mabar\/?/, '').replace(/^index\.html$/, '') + location.search + location.hash);
  </script>
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #EEF2F5; color: #0F1E2C;
      font: 16px/1.5 system-ui, -apple-system, sans-serif; text-align: center; padding: 0 24px; }
    a { color: #1E6BB8; font-weight: 600; }
  </style>
</head>
<body>
  <p>Mabar sekarang <b>Match Addict</b>.<br><a href="https://asepsugi.github.io/match-addict/">Buka Match Addict</a></p>
</body>
</html>
