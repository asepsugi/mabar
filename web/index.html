<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Aplikasi mabar tennis & padel untuk klub/komunitas">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Mabar">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Mabar</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
  <script>
    // Tombol "Pasang Mabar" di Beranda (lib/features/home/app_install_web.dart).
    // beforeinstallprompt bisa datang sebelum Flutter selesai dimuat, jadi ditangkap di sini dan
    // disimpan sampai tombolnya ditekan. Browser tidak mengirimnya kalau app sudah terpasang.
    window.mabarInstall = (() => {
      let deferred = null;
      const api = {
        onchange: null,
        // 'prompt': dialog pasang bawaan bisa dimunculkan · 'manual': iPhone/iPad, tidak ada API
        // pasang, hanya lewat menu Bagikan · 'none': sudah dibuka sebagai app / tidak didukung.
        state() {
          if (matchMedia('(display-mode: standalone)').matches || navigator.standalone) return 'none';
          if (deferred) return 'prompt';
          // iPadOS mengaku Mac; bedanya hanya di layar sentuh.
          const ios = /iPhone|iPad|iPod/.test(navigator.userAgent) ||
            (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
          return ios ? 'manual' : 'none';
        },
        async prompt() {
          const event = deferred;
          if (!event) return;
          deferred = null; // satu event hanya bisa prompt() sekali
          event.prompt();
          await event.userChoice;
          notify();
        },
      };
      const notify = () => api.onchange?.();
      addEventListener('beforeinstallprompt', (e) => { e.preventDefault(); deferred = e; notify(); });
      addEventListener('appinstalled', () => { deferred = null; notify(); });
      return api;
    })();
  </script>
  <script>
    // Back Android di PWA = back browser (lib/core/router/browser_back_web.dart). Flutter tidak menulis riwayat
    // (appRouterConfig); di sini riwayat dijaga dua entri, dasar + penjaga. Back dari penjaga ditangkap sebelum
    // Flutter, dipantulkan kembali ke penjaga dengan forward, lalu Dart menutup layar teratas. Bukan pushState
    // seperti riwayat bawaan Flutter: Chrome melewati entri yang ditambah tanpa ketukan, jadi back kedua
    // berturut-turut malah menutup app. Di Beranda (tidak ada yang ditutup) back tidak dipantulkan: back
    // berikutnya keluar dari app, kecuali layar disentuh dulu.
    (() => {
      const isBase = (state) => state?.mabar === 'base';
      history.replaceState({ mabar: 'base' }, '');
      history.pushState({ mabar: 'guard' }, '');
      let atBase = false;
      addEventListener('popstate', (e) => {
        e.stopImmediatePropagation();
        if (!isBase(e.state)) return; // pantulan kembali ke penjaga
        if (window.mabarBack?.()) history.forward(); else atBase = true;
      });
      addEventListener('pointerdown', () => {
        if (!atBase) return;
        atBase = false;
        history.forward();
      }, true);
    })();
  </script>
  <script>
    // Offline: sw.js (diisi tool/build_web.sh). Gagal daftar tidak fatal, app tetap jalan online.
    // Versi baru yang sudah terunduh di sesi sebelumnya langsung dipasang saat app dibuka, lalu
    // halaman dimuat ulang sekali — PWA di Android jarang benar-benar ditutup, jadi menunggu
    // "semua tab tertutup" bisa berhari-hari. Aman: state turnamen ada di storage, bukan di memori.
    if ('serviceWorker' in navigator) {
      let updating = false;
      navigator.serviceWorker.addEventListener('controllerchange', () => {
        if (updating) location.reload();
      });
      navigator.serviceWorker.register('sw.js').then((reg) => {
        if (reg.waiting && navigator.serviceWorker.controller) {
          updating = true;
          reg.waiting.postMessage('skipWaiting');
        }
      });
    }
  </script>
</body>
</html>
