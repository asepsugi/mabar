<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Aplikasi mabar tennis & padel untuk klub/komunitas">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Mabar">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Mabar</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
  <script>
    // Offline: sw.js (diisi tool/build_web.sh). Gagal daftar tidak fatal, app tetap jalan online.
    // Versi baru yang sudah terunduh di sesi sebelumnya langsung dipasang saat app dibuka, lalu
    // halaman dimuat ulang sekali — PWA di Android jarang benar-benar ditutup, jadi menunggu
    // "semua tab tertutup" bisa berhari-hari. Aman: state turnamen ada di storage, bukan di memori.
    if ('serviceWorker' in navigator) {
      let updating = false;
      navigator.serviceWorker.addEventListener('controllerchange', () => {
        if (updating) location.reload();
      });
      navigator.serviceWorker.register('sw.js').then((reg) => {
        if (reg.waiting && navigator.serviceWorker.controller) {
          updating = true;
          reg.waiting.postMessage('skipWaiting');
        }
      });
    }
  </script>
</body>
</html>
