name: mabar
description: "Aplikasi mabar tennis & padel untuk klub/komunitas."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State management (manual providers, no codegen)
  flutter_riverpod: ^2.5.1

  # Local storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  path_provider: ^2.1.4

  # Navigation
  go_router: ^14.6.1

  # Utilities
  intl: ^0.19.0
  uuid: ^4.5.1
  collection: ^1.19.0

  # Share
  share_plus: ^10.1.2
  screenshot: ^3.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.13
  flutter_launcher_icons: ^0.14.3

# Sumbernya digenerate dari brand mark lewat `flutter test tool/generate_app_icon.dart`,
# lalu `dart run flutter_launcher_icons` menyebarnya ke android/ dan ios/.
flutter_launcher_icons:
  image_path: assets/icon/app_icon.png
  android: true
  adaptive_icon_background: assets/icon/app_icon_background.png
  adaptive_icon_foreground: assets/icon/app_icon_foreground.png
  ios: true
  # iOS menolak icon ber-alpha; latarnya memang sudah penuh, ini cuma penjaga.
  remove_alpha_ios: true
  # PWA: ikon + favicon ikut digenerate dari sumber yang sama. Warnanya = MabarColors.background,
  # sama dengan latar app supaya splash PWA dan status bar menyatu dengan layar pertama.
  web:
    generate: true
    image_path: assets/icon/app_icon.png
    background_color: "#FAFAFA"
    theme_color: "#FAFAFA"

flutter:
  uses-material-design: true
  assets:
    - assets/images/
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
        - asset: assets/fonts/Inter-ExtraBold.ttf
          weight: 800
